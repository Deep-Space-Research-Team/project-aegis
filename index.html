<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Aegis | NEO Tracker</title>
    <meta name="description" content="Live Near-Earth Object Tracking System based on NASA NeoWs API">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JB0X2VS9Q7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-JB0X2VS9Q7');

    <link rel="stylesheet" href="style.css">

<body>

    <nav class="navbar">
        <div class="nav-brand">
            <!-- Changed icon to a shield to match 'Aegis' -->
            <i class="fa-solid fa-shield-halved"></i> Project Aegis
        </div>
        <div class="nav-links">
            <a href="https://deep-space-api-cuhq.onrender.com/sync-data" target="_blank" class="btn btn-outline">Sync Data</a>

    <main class="container">

            <h1>Near-Earth Object Database</h1>

            <i class="fa-solid fa-circle-notch fa-spin"></i> Establishing connection to Project Aegis Database...
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard" id="asteroid-grid">
            <!-- Asteroid cards will be injected here by script.js -->
        </div>
    </main>

    <footer>
        <p>Data powered by NASA NeoWs API | System connected to Project Aegis Server</p>
    </footer>

    <script src="script.js"></script>
